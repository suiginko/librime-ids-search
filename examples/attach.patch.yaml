# 挂接到现有 Rime 方案的参考 patch
#
# 用法：
#   1. 把本文件内容合并到 <方案名>.custom.yaml 的 patch: 节点下；
#   2. 把 ids_data.bin 放到用户数据目录的 build/ 下；
#   3. 重新部署。
#
# I 模式与 O 模式都由插件原生 processor + segmentor 触发，
# 不再依赖 recognizer/patterns/ids_search 和 matcher。
# 现有方案中的 matcher/recognizer 可以保留，用于其他规则。

patch:
  engine/processors/@before 0: ids_search_processor
  engine/processors/@before 1: ids_hybrid_processor
  engine/segmentors/@before 0: ids_search_segmentor
  engine/segmentors/@before 1: ids_hybrid_segmentor
  engine/filters/@before 0: ids_search_filter
  engine/filters/@before 1: ids_hybrid_filter

  engine/translators/+:
    - ids_search_translator
    - ids_hybrid_translator
  engine/filters/+:
    - ids_hybrid_cleaner

  ids_search:
    data_file: build/ids_data.bin
    tag: ids_search
    prefix: "I"
    tips: "〔部件检字〕"
    max_results: 60
    shuangpin_scheme: flypy
    show_pinyin: true
    show_ids: true
    show_unicode: true
    show_block: true
    ids_format: unicode
    custom_file: ids_custom.txt

  ids_hybrid:
    data_file: build/ids_data.bin
    tag: ids_search_hybrid
    prefix: "O"
    tips: "〔汉字部件检字〕"
    max_results: 60
    shuangpin_scheme: flypy
    show_pinyin: true
    show_ids: true
    show_unicode: true
    show_block: true
    ids_format: unicode
    custom_file: ids_custom.txt
